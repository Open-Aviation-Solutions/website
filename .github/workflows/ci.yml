name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VALE_VERSION: '3.14.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        timeout-minutes: 10
        env:
          HOME: /root

  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install en_AU Hunspell dictionary
        run: sudo apt-get install -y hunspell-en-au

      - name: Install Vale
        run: |
          curl -sL "https://github.com/vale-cli/vale/releases/download/v${{ env.VALE_VERSION }}/vale_${{ env.VALE_VERSION }}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale

      - name: Check
        run: make check
