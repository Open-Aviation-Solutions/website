name: Link check

# External links break for reasons outside this repo (sites move pages, rename
# slugs, go down), so checking them must not block pushes or PRs. Instead this
# runs on a schedule and on demand. On failure GitHub notifies the repo owner.
on:
  schedule:
    # Weekly, Monday 02:00 UTC.
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  # Keep in sync with the LYCHEE_VERSION ARG in Dockerfile.
  LYCHEE_VERSION: '0.24.2'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install lychee
        run: |
          curl -sL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${{ env.LYCHEE_VERSION }}/lychee-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee

      # Builds the site, then checks internal and external links over the network.
      - name: Check links
        run: make check-links
